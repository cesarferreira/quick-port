[package]
name = "quick-port"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "See and manage your local development servers"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/quick-port"

[[bin]]
name = "quick-port"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
